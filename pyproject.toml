[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchcli"
version = "0.1.0"
description = "A CLI research assistant for learning LLM APIs"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "python-dotenv",
    "typer",
    "rich",
]

[project.scripts]
research = "researchcli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]